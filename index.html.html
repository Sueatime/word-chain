<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Chain</title>
<meta name="color-scheme" content="dark">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--h:260;--a:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--a) 70% 68%);--key:hsl(var(--h) 14% 30%);--lite:hsl(var(--a) 95% 66%);--dark:hsl(var(--a) 60% 10%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:24px 16px 32px;text-align:center}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 auto 22px;max-width:420px;line-height:1.4;color:var(--mute);font-size:15px}
.q{background:var(--panel);border:2px solid var(--pur);border-radius:12px;padding:14px 16px;margin:0 0 18px}
.q b{display:block;font-size:20px;font-weight:600}
.q span{display:block;margin-top:4px;color:var(--mute);font-size:15px;line-height:1.4}
.chain{display:flex;flex-direction:column}
.node,input{height:52px;border-radius:8px;font:inherit;font-size:22px;font-weight:700;letter-spacing:5px;text-transform:uppercase;text-align:center;width:100%}
.node{background:var(--lite);color:var(--dark);display:flex;align-items:center;justify-content:center}
.link{width:6px;height:26px;margin:0 auto;background:var(--pur);border-radius:3px}
input{padding:0 12px;border:2px solid var(--mute);background:transparent;color:transparent;caret-color:transparent;outline:none}
.cell{position:relative}
.mask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:22px;font-weight:700;letter-spacing:7px;padding-left:7px;text-transform:uppercase;color:var(--ink)}
input.good+.mask{color:var(--dark)}
input:focus-visible{border-color:var(--pur)}
input.good{background:var(--lite);border-color:var(--lite)}
input.rev{background:hsl(var(--a) 25% 38%);border-color:hsl(var(--a) 25% 38%)}
input.wrong{border-color:hsl(0 85% 66%);animation:shake .4s}
input.wrong+.mask{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){input.wrong,input.wrong+.mask{animation:none}}
.msg{min-height:26px;font-weight:600;margin:14px 0 0}
.end{margin-top:16px;display:flex;gap:10px}
button{flex:1;font:inherit;font-weight:600;padding:10px 8px;border-radius:8px;border:2px solid var(--mute);background:transparent;color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
</style></head><body><main>
<h1>Word Chain</h1>
<p class="sub">Fill in the blanks to complete the chain. Find every missing word to clear it.</p>
<div class="q"><b id="bt"></b><span id="br"></span></div>
<div class="chain" id="chain"></div>
<div class="msg" id="msg"></div>
<div class="end"><button id="new">New game</button><button id="hint">Hint</button><button id="give">Give up</button></div>
</main>
<script>
const P=[
{m:'classic',w:['CAT','TIGER','RABBIT','TURTLE','EAGLE']},
{m:'classic',w:['APPLE','ELEPHANT','TOMATO','OCEAN','NIGHT','TIGER']},
{m:'classic',w:['SUN','NIGHT','TABLE','EARTH','HORSE']},
{m:'classic',w:['BOOK','KITCHEN','NATURE','ELEPHANT','TREE']},
{m:'classic',w:['WINDOW','WINTER','RAINBOW','WATER','RIVER']},
{m:'classic',w:['GARDEN','NUMBER','RABBIT','TRAVEL','LEMON','NIGHT']},
{m:'classic',w:['PLANET','TEACHER','RAINBOW','WONDER','ROCKET']},
{m:'classic',w:['MONKEY','YELLOW','WALLET','TICKET','TRAIN']},
{m:'classic',w:['SCHOOL','LIBRARY','YOGURT','TUNNEL','LADDER']},
{m:'classic',w:['FLOWER','RABBIT','TOMATO','ORANGE','ENGINE']},
{m:'classic',w:['BRIDGE','EAGLE','ENERGY','YOUNG','GUITAR']},
{m:'classic',w:['CASTLE','ELEVEN','NAPKIN','NOODLE','EXPERT']},
{m:'classic',w:['MOUNTAIN','NEPHEW','WEATHER','RIVER','RABBIT']},
{m:'classic',w:['OCEAN','NATURE','EVENING','GARAGE','EXAMPLE']},
{m:'classic',w:['PENCIL','LANTERN','NECKLACE','ENGINE','EARTH']},
{m:'classic',w:['JUNGLE','EXPERT','TRAVEL','LADDER','ROCKET']},
{m:'classic',w:['DRAGON','NIGHT','TEACHER','ROBOT','TUNNEL']},
{m:'classic',w:['SUMMER','ROCKET','TRAIN','NEPHEW','WALLET']},
{m:'classic',w:['BUTTER','RIBBON','NURSERY','YOGURT','TOMATO']},
{m:'classic',w:['PUZZLE','EXERCISE','EMPEROR','RESCUE','EAGLE']},
{m:'category',c:'Animals',w:['LION','NEWT','TIGER','RABBIT','TOAD']},
{m:'category',c:'Countries',w:['SPAIN','NEPAL','LAOS','SWEDEN','NORWAY']},
{m:'category',c:'Countries',w:['CHILE','EGYPT','TURKEY','YEMEN','NIGER','RUSSIA']},
{m:'category',c:'Animals',w:['ZEBRA','ALPACA','ANTELOPE','ELEPHANT','TURTLE']},
{m:'category',c:'Animals',w:['OTTER','RACCOON','NEWT','TOAD','DOLPHIN','NARWHAL']},
{m:'category',c:'Countries',w:['IRAN','NORWAY','YEMEN','NIGERIA','ANGOLA']},
{m:'category',c:'Cities',w:['LONDON','NAIROBI','ISTANBUL','LIMA','ATHENS','SEOUL']},
{m:'category',c:'Cities',w:['TOKYO','OSLO','OTTAWA','ACCRA','ABUJA']},
{m:'category',c:'Body parts',w:['KNEE','EYE','ELBOW','WRIST','TOE'],alt:{3:['WAIST']}},
{m:'category',c:'Body parts',w:['SHIN','NOSE','EAR','RIB','BACK','KNEE'],alt:{1:['NAPE'],4:['BEAK']}},
{m:'category',c:'Colors',w:['BLACK','KHAKI','INDIGO','ORANGE','EMERALD']},
{m:'category',c:'Food',w:['BREAD','DUMPLING','GARLIC','CHEESE','EGG']},
{m:'category',c:'Vegetables',w:['LEEK','KALE','EGGPLANT','TURNIP','PEPPER','RADISH']},
{m:'category',c:'Sports',w:['TENNIS','SOCCER','ROWING','GOLF','FENCING'],alt:{2:['RACING']}},
{m:'category',c:'Jobs',w:['SURGEON','NURSE','EDITOR','REPORTER','RANGER']},
{m:'category',c:'Clothes',w:['DRESS','SKIRT','TROUSERS','SWEATER','ROBE'],alt:{1:['SHIRT']}},
{m:'category',c:'Countries',w:['IRELAND','DENMARK','KENYA','AUSTRALIA','ANGOLA'],alt:{3:['ARGENTINA']}},
{m:'category',c:'Countries',w:['ICELAND','DENMARK','KUWAIT','TURKEY','YEMEN']},
{m:'category',c:'Countries',w:['MEXICO','OMAN','NEPAL','LEBANON','NORWAY']},
{m:'category',c:'Food',w:['PIZZA','AVOCADO','OMELETTE','EGGPLANT','TOAST']},
{m:'category',c:'Food',w:['NOODLES','SANDWICH','HAMBURGER','RICE','EGG']},
{m:'category',c:'Sports',w:['HOCKEY','YOGA','ARCHERY','YACHTING','GOLF']},
{m:'compound',w:['FIRE','WORK','BOOK','MARK','DOWN']},
{m:'compound',w:['RAIN','BOW','TIE','BREAK','FAST']},
{m:'compound',w:['SUN','LIGHT','HOUSE','BOAT','YARD','STICK']},
{m:'compound',w:['CUP','CAKE','WALK','WAY','SIDE'],alt:{3:['OUT']}},
{m:'compound',w:['SEA','HORSE','SHOE','LACE','WORK']},
{m:'compound',w:['WATER','FALL','OUT','SIDE','WALK']},
{m:'compound',w:['HAND','BAG','PIPE','LINE','MAN','HOLE']},
{m:'compound',w:['FOOT','BALL','PARK','WAY','SIDE']},
{m:'compound',w:['BLUE','BIRD','HOUSE','WORK','SHOP']},
{m:'compound',w:['AIR','MAIL','BOX','CAR','PORT']},
{m:'compound',w:['DOOR','BELL','BOY','HOOD','WINK']},
{m:'compound',w:['EYE','BROW','BEAT','BOX','CAR']},
{m:'compound',w:['SNOW','FALL','OUT','LAW','SUIT']},
{m:'compound',w:['ROCK','STAR','FISH','BONE','YARD']},
{m:'compound',w:['BUTTER','FLY','WHEEL','CHAIR','MAN']},
{m:'compound',w:['PAN','HANDLE','BAR','BELL','BOY']},
{m:'compound',w:['PIGGY','BACK','BONE','YARD','STICK']},
{m:'compound',w:['BED','TIME','TABLE','TOP','SOIL']},
{m:'compound',w:['DAY','DREAM','LAND','MARK','DOWN']},
{m:'compound',w:['SUPER','STAR','DUST','PAN','CAKE']},
{m:'classic',w:['BEACH','HAMMER','RED','DRAGON','NOSE']},
{m:'classic',w:['GAME','EARTH','HOSTEL','LEMON','NECKLACE']},
{m:'category',c:'Animals',w:['TIGER','RHINO','OCTOPUS','SNAKE','EEL']},
{m:'category',c:'Food',w:['EGG','GRAPEFRUIT','TACO','ORANGE','EEL','LEMON']},
{m:'compound',w:['STREET','FOOD','COURT','YARD','SALE']},
{m:'compound',w:['RENTAL','CAR','PARK','BENCH','MARK','DOWN']},
{m:'compound',w:['BABY','FACE','BOOK','FAIR','TRADE','MARK']},
{m:'compound',w:['PALM','TREE','HOUSE','FIRE','ALARM','CLOCK']},
{m:'compound',w:['TURN','TABLE','SPOON','FEED','BACK','BONE']},
{m:'compound',w:['NEWBORN','BABY','BOTTLE','NECK','TIE','BREAK']},
{m:'compound',w:['NIGHT','LIFE','TIME','WASTE','WATER','MELON']},
{m:'compound',w:['NEXT','DOOR','HANDLE','BAR','CODE']},
{m:'compound',w:['ANNUAL','LEAVE','ALONE','TIME','BOMB','SQUAD']},
{m:'compound',w:['PINE','APPLE','TREE','FARM','LAND','LORD']},
{m:'compound',w:['HARD','COPY','CAT','HAIR','GEL']},
{m:'compound',w:['COVER','STORY','BOOK','FAIR','PLAY']},
{m:'compound',w:['FAST','FOOD','TRUCK','DRIVER','LICENSE']},
{m:'compound',w:['MINERAL','WATER','FALL','SEASON','FINALE']},
{m:'compound',w:['MAIN','STREET','LIGHT','HOUSE','KEEPING']},
{m:'compound',w:['BLACK','COFFEE','CUP','CAKE','BOX']}];
const HUES=[0,20,35,45,95,125,150,205,225,245,260,280,300,320,340];
const $=i=>document.getElementById(i);
let used=[],last=null,hue=-1,cur,kn,typ,shown,hinted,solved,ins=[],over=false;
function pick(){let c=P.map((_,i)=>i).filter(i=>!used.includes(i));
if(!c.length){used=[];c=P.map((_,i)=>i)}
let d=c.filter(i=>P[i].m!==last);if(!d.length)d=c;
const i=d[Math.random()*d.length|0];used.push(i);return i}
const free=k=>cur.w[k].length-Object.keys(kn[k]).length;
function layout(k,t){let j=0,s='';for(let i=0;i<cur.w[k].length;i++)s+=kn[k][i]!==undefined?kn[k][i]:(j<t.length?t[j++]:'_');return s}
function paint(k){ins[k].nextElementSibling.textContent=shown[k]||layout(k,typ[k])}
function start(){
const p=P[pick()];cur=p;last=p.m;over=false;
let h;do{h=HUES[Math.random()*HUES.length|0]}while(h===hue);hue=h;
document.documentElement.style.setProperty('--a',h);
solved=p.w.map((_,k)=>k==0||k==p.w.length-1);
kn=p.w.map((w,k)=>{const o={};if(p.m==='classic'&&!solved[k])o[w.length>>1]=w[w.length>>1];return o});
typ=p.w.map(()=>'');shown=p.w.map(()=>'');hinted=p.w.map(()=>0);
const t={classic:['Classic','Start each word with the last letter of the word before it. One letter in each blank is filled in.'],
category:['Category: '+p.c,'Every word is in this category, and each starts with the last letter of the word before it.'],
compound:['Compound','Each word joins the one before it to make a compound word, like sun + flower.']}[p.m];
$('bt').textContent=t[0];$('br').textContent=t[1];
let s='';ins=[];
p.w.forEach((w,k)=>{
if(k>0)s+='<div class="link"></div>';
if(solved[k])s+='<div class="node">'+w+'</div>';
else s+='<div class="cell"><input data-k="'+k+'" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Word '+(k+1)+', '+w.length+' letters"><div class="mask"></div></div>'});
$('chain').innerHTML=s;$('msg').textContent='';$('msg').style.color='';
$('hint').disabled=false;$('give').disabled=false;
document.querySelectorAll('input').forEach(el=>{ins[+el.dataset.k]=el;el.addEventListener('input',onIn)});
ins.forEach((e,k)=>e&&paint(k));focusNext()}
function focusNext(){for(let k=0;k<solved.length;k++)if(!solved[k]&&ins[k]){ins[k].focus();return}}
function onIn(e){if(over)return;const el=e.target,k=+el.dataset.k;
typ[k]=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,free(k));
el.value=typ[k];el.classList.remove('wrong');paint(k);check(k)}
function check(k){const el=ins[k];if(typ[k].length!==free(k))return;
const f=layout(k,typ[k]);
if(f===cur.w[k]||((cur.alt||{})[k]||[]).includes(f)){solved[k]=true;shown[k]=f;el.classList.add('good');el.readOnly=true;paint(k);
if(solved.every(Boolean)){end();$('msg').textContent='Chain cleared!';confetti()}else focusNext()}
else{void el.offsetWidth;el.classList.add('wrong')}}
function end(){over=true;$('hint').disabled=true;$('give').disabled=true}
$('hint').onclick=()=>{if(over)return;
const c=[];solved.forEach((s,k)=>{if(!s&&!hinted[k])c.push(k)});
if(!c.length){$('msg').textContent='All remaining answers already have a hint.';return}
const k=c[Math.random()*c.length|0],w=cur.w[k];hinted[k]=1;kn[k][0]=w[0];kn[k][w.length-1]=w[w.length-1];
typ[k]=typ[k].slice(0,free(k));ins[k].value=typ[k];ins[k].classList.remove('wrong');paint(k);ins[k].focus();
$('msg').textContent='Hint: one answer now shows its first and last letter.';check(k)};
$('give').onclick=()=>{if(over)return;end();
for(let k=0;k<solved.length;k++)if(!solved[k]){shown[k]=cur.w[k];ins[k].readOnly=true;ins[k].className='rev';paint(k)}
$('msg').textContent='You gave up. Here are the answers.'};
$('new').onclick=start;
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
start();
</script></body></html>
